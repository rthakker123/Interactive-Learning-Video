<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Learning Video</title>
    <link rel="icon" type="image/jpeg" href="./resources/favicon.jpg">
    <link rel="stylesheet" href="./resources/styles.css">
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>
    <main class="container">
        <h1>Interactive Learning Video</h1>

<div class="url-container">
    <input type="text" id="url-input" placeholder="Paste a YouTube URL">
    <button id="load-url-button" class="btn">Load Video</button>
</div>



<div class="video-container">
    <iframe
         id="interactive-video"
         src=""
         title="YouTube video player"
         allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
         allowfullscreen>
            </iframe>
        </div>

        <p id="status-message"></p>
    </main>

    <script src="./resources/script.js"></script>
</body>
</html>
