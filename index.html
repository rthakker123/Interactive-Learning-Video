<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="./resources/favicon.jpg">
    <link rel="stylesheet" href="./resources/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Learning Video</title>
</head>
<body>
    <main class="container">
        <div class="video-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/I2wURDqiXdM?si=7iVmaTvOccvAYKfa" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <div id="interactive-overlay" class="overlay hidden">
                <div class="overlay-content">
                    <h2 id="question-text" placeholder="Enter your question here..."> </h2>
                </div>
            </div>
        </div>
        <div class="url-container">
            <input type="text" id="url-input" placeholder="Enter a URL">
            <button id="load-url-button" class="btn">Load URL</button>
        </div>
        </main>
  </main>

  <script src="./resources/script.js"></script>
</body>
</html>
